<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>
<div id="splash">
  <img class="splashIcon" src="icon-192.png" alt="مسار التعليم" width="84" height="84">
  <div class="splashName">مسار التعليم</div>
  <div class="splashSub">منصة المعلم للمحاضرات والطلبة والاختبارات</div>
</div>
<header class="top">
  <div class="school"><img class="headerBrandIcon" src="icon-192.png" alt=""><div class="schoolIdentity"><span class="appMiniName">مسار التعليم</span><input id="schoolName" class="schoolName" aria-label="اسم المدرسة"></div></div>
  <div class="hActions">
    <button id="fsBtn" class="hBtn iconOnly" title="ملء الشاشة">⛶</button>
    <button id="darkBtn" class="hBtn iconOnly" title="الوضع الليلي">🌙</button>
    <button id="wsBtn" class="hBtn" title="إدارة المؤسسات">🏫 مؤسساتي</button>
    <span class="year" id="yearLbl"></span>
  </div>
</header>
<main class="content" id="content"><div class="loading">جارِ تحميل البيانات…</div></main>
<div id="storageBanner"></div>
<nav class="tabs" id="tabs"></nav>
<div id="fabBox"></div>
<div id="modal"></div>
<div id="toastBox"></div>
<div id="printArea"></div>
<input type="file" id="importFile" accept=".json" style="display:none">

<script src="katex/katex.min.js?v=2.3.0"></script>
<script src="masar-core.js?v=2.3.0"></script>
<script src="masar-storage.js?v=2.3.0"></script>
<script src="masar-print-engine.js?v=2.3.0"></script>
<script src="masar-dashboard.js?v=2.3.0"></script>
<script src="masar-document-core.js?v=2.3.0"></script>
<script src="masar-lectures.js?v=2.3.0"></script>
<script src="masar-students.js?v=2.3.0"></script>
<script src="masar-exams.js?v=2.3.0"></script>
<script src="masar-grades-attendance.js?v=2.3.0"></script>
<script src="masar-engagement.js?v=2.3.0"></script>
<script src="masar-app-shell.js?v=2.3.0"></script>
